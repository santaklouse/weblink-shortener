services:
  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: "0.39.9"
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?Set PB_SUPERUSER_EMAIL in .env}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?Set PB_SUPERUSER_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - |
        ./pocketbase superuser upsert "$${PB_SUPERUSER_EMAIL}" "$${PB_SUPERUSER_PASSWORD}"
        exec ./pocketbase serve --http=0.0.0.0:8090
    volumes:
      - pocketbase_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  setup:
    build:
      context: .
    environment:
      NODE_ENV: development
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?Set PB_SUPERUSER_EMAIL in .env}
      POCKETBASE_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?Set PB_SUPERUSER_PASSWORD in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_AUTH_METHOD: ${SMTP_AUTH_METHOD:-PLAIN}
      SMTP_LOCAL_NAME: ${SMTP_LOCAL_NAME:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Weblink Shortener}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    command: ["node", "scripts/setup-pocketbase.js"]
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?Set PB_SUPERUSER_EMAIL in .env}
      POCKETBASE_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?Set PB_SUPERUSER_PASSWORD in .env}
      TRUST_PROXY: "true"
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-weblink_session}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      ANONYMOUS_LINK_TTL_HOURS: ${ANONYMOUS_LINK_TTL_HOURS:-24}
      ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:?Set ANALYTICS_HASH_SECRET in .env}
      ANALYTICS_MAX_EVENTS: ${ANALYTICS_MAX_EVENTS:-5000}
      ANALYTICS_RECENT_EVENTS: ${ANALYTICS_RECENT_EVENTS:-50}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/geoip/GeoLite2-Country.mmdb}
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    read_only: true
    volumes:
      - ./geoip:/geoip:ro
    tmpfs:
      - /tmp

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      SHORTENER_DOMAIN: ${SHORTENER_DOMAIN:-localhost}
      POCKETBASE_ADMIN_DOMAIN: ${POCKETBASE_ADMIN_DOMAIN:-pb.localhost}
      ADMIN_ALLOWED_IP: ${ADMIN_ALLOWED_IP:-0.0.0.0/0}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/default.conf.template:ro
    command:
      - /bin/sh
      - -ec
      - envsubst '$$SHORTENER_DOMAIN $$POCKETBASE_ADMIN_DOMAIN $$ADMIN_ALLOWED_IP' < /etc/nginx/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    depends_on:
      app:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      pocketbase:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pocketbase_data:
