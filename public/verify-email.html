<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Verify your email</title>
    <link rel="stylesheet" href="/styles.css?v=11" />
    <script src="/verify-email.js?v=1" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card compact auth-page" aria-labelledby="page-title">
        <p class="eyebrow">ACCOUNT VERIFICATION</p>
        <h1 id="page-title">Verify your email</h1>
        <p class="intro">Confirm your email address before signing in and managing permanent links.</p>

        <p id="verify-email-message" class="message" role="status" aria-live="polite"></p>

        <section id="verify-email-success" class="auth-success" hidden>
          <h2 id="verify-email-success-title">Check your inbox</h2>
          <p id="verify-email-success-text"></p>
        </section>

        <form id="resend-verification-form" novalidate>
          <label for="verification-email">Email</label>
          <input id="verification-email" name="email" type="email" autocomplete="email" autofocus required />
          <button type="submit">Resend verification email</button>
        </form>

        <a class="auth-back-link" href="/">Back to sign in</a>
      </section>
    </main>
  </body>
</html>
