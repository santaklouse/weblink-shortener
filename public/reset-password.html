<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Choose a new password</title>
    <link rel="stylesheet" href="/styles.css?v=10" />
    <script src="/reset-password.js?v=1" defer></script>
    <script src="/password-visibility.js?v=1" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card compact auth-page" aria-labelledby="page-title">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1 id="page-title">Choose a new password</h1>
        <p class="intro">Use a unique password containing at least 8 characters.</p>

        <form id="reset-password-form" novalidate>
          <label for="new-password">New password</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" data-password-toggle autofocus required />
          <label for="new-password-confirm">Confirm new password</label>
          <input id="new-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" data-password-toggle required />
          <button type="submit">Set new password</button>
        </form>
        <p id="reset-password-message" class="message" role="status" aria-live="polite"></p>

        <section id="reset-password-success" class="auth-success" hidden>
          <h2>Password updated</h2>
          <p>Your password has been changed. You can now sign in with the new password.</p>
        </section>

        <a class="auth-back-link" href="/">Back to sign in</a>
      </section>
    </main>
  </body>
</html>
