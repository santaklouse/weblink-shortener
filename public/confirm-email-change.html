<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Confirm your new email</title>
    <link rel="stylesheet" href="/styles.css?v=11" />
    <script src="/confirm-email-change.js?v=1" defer></script>
    <script src="/password-visibility.js?v=1" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card compact auth-page" aria-labelledby="page-title">
        <p class="eyebrow">ACCOUNT SECURITY</p>
        <h1 id="page-title">Confirm your new email</h1>
        <p class="intro">Enter your current password to finish changing your email address.</p>

        <form id="confirm-email-change-form" novalidate>
          <label for="email-change-password">Current password</label>
          <input id="email-change-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" data-password-toggle autofocus required />
          <button type="submit">Confirm email change</button>
        </form>
        <p id="confirm-email-change-message" class="message" role="status" aria-live="polite"></p>

        <section id="confirm-email-change-success" class="auth-success" hidden>
          <h2>Email updated</h2>
          <p>Your email address has been changed. Sign in again with the new address.</p>
        </section>

        <a class="auth-back-link" href="/">Back to sign in</a>
      </section>
    </main>
  </body>
</html>
