<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Forgot password</title>
    <link rel="stylesheet" href="/styles.css?v=9" />
    <script src="/forgot-password.js?v=1" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card compact auth-page" aria-labelledby="page-title">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1 id="page-title">Reset your password</h1>
        <p class="intro">Enter your account email and we will send you a secure password reset link.</p>

        <form id="forgot-password-form" novalidate>
          <label for="reset-email">Email</label>
          <input id="reset-email" name="email" type="email" autocomplete="email" autofocus required />
          <button type="submit">Send reset link</button>
          <p id="forgot-password-message" class="message" role="status" aria-live="polite"></p>
        </form>

        <section id="forgot-password-success" class="auth-success" hidden>
          <h2>Check your inbox</h2>
          <p>If an account exists for that email, a password reset link has been sent. Check your spam folder if it does not arrive.</p>
        </section>

        <a class="auth-back-link" href="/">Back to sign in</a>
      </section>
    </main>
  </body>
</html>
